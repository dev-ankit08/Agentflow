# Full local stack with Docker. Run from the repo root:
#   docker compose -f infra/docker-compose.yml up --build
# Without Docker, use `pnpm db:start` + `pnpm dev` instead (see README).
name: agentflow

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
      POSTGRES_DB: agentflow
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agentflow
      MINIO_ROOT_PASSWORD: agentflow-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  migrate:
    build: { context: .., dockerfile: infra/Dockerfile, target: tools }
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    environment: &common-env
      DATABASE_URL: postgres://agentflow:agentflow@postgres:5432/agentflow
      REDIS_URL: redis://redis:6379
      API_JWT_SECRET: ${API_JWT_SECRET:?set API_JWT_SECRET in .env}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?set SECRETS_MASTER_KEY in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: http://localhost:3100
      API_URL: http://api:4000
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: infra/Dockerfile, target: api }
    environment: *common-env
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: .., dockerfile: infra/Dockerfile, target: worker }
    environment: *common-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  builder:
    build: { context: .., dockerfile: infra/Dockerfile, target: builder }
    environment: *common-env
    ports: ["3100:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
